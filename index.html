<div class="container">
  <header>
    <h1 id="app-title">Simulador de Exámenes VMware</h1>
    <p id="question-counter"></p>
  </header>

  <!-- PANTALLA PRINCIPAL: Selección de examen -->
  <div id="exam-selector-screen">
    <h2>Selecciona un examen para comenzar:</h2>
    <div class="exam-buttons" style="display: flex; gap: 15px; margin-top: 20px;">
      <button onclick="selectExam('vcf-exam.json', 'VMware Cloud Foundation')">Examen VCF</button>
      <button onclick="selectExam('vsphere-exam.json', 'VMware vSphere')">Examen vSphere</button>
    </div>
  </div>

  <!-- PANTALLA DE PREGUNTAS (Oculta al inicio) -->
  <div id="quiz-screen" style="display: none;">
    <div id="score-box" class="score-box"></div>
    <main id="questions-wrapper"></main>
    <div class="actions">
      <button id="submit-btn" onclick="evaluateExam()">Finalizar y Calificar</button>
      <button onclick="goBackToMenu()" style="background-color: #6c757d; margin-top: 10px;">Volver al Menú</button>
    </div>
  </div>
</div>
