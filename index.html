<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcom Partner Certification Simulator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Capa de fondo azul dinámico tipo VMware -->
  <div class="vmware-bg"></div>

  <div class="app-container">
    <header class="main-header">
      <div class="brand">
        <span class="logo-text">BROADCOM PARTNER</span>
        <span class="badge-vcf">PROVEN PROFESSIONAL</span>
      </div>
      <h1 id="app-title">Simulador de Certificaciones</h1>
      <p id="question-counter" class="subtitle">Selecciona tu ruta de certificación oficial para comenzar</p>
    </header>

    <!-- PANTALLA PRINCIPAL: SELECTOR DE EXÁMENES -->
    <main id="exam-selector-screen">

      <!-- SECCIÓN 1: PLATFORM TECHNICAL -->
      <section class="exam-group">
        <div class="group-header">
          <span class="group-badge platform-badge">Core Platform</span>
          <h2>Platform Technical</h2>
        </div>
        <div class="grid-cards">

          <!-- Implementation -->
          <button class="exam-card card-platform" onclick="selectExam('vcf-implementation.json', 'VCF - Implementation')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">VMware Cloud Foundation - Implementation</span>
            <div class="card-footer">
              <span class="status-pill">Examen Activo</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

          <!-- Architecture -->
          <button class="exam-card card-platform" onclick="selectExam('vcf-architecture.json', 'VMware Cloud Foundation - Architecture')">
  <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
  <span class="card-title">VMware Cloud Foundation - Architecture</span>
  <div class="card-footer">
    <span class="status-pill">Examen Activo</span>
    <span class="arrow-icon">→</span>
  </div>
</button>

        </div>
      </section>

      <!-- SECCIÓN 2: SPECIALIZATION TECHNICAL -->
      <section class="exam-group">
        <div class="group-header">
          <span class="group-badge spec-badge">Specialist Tracks</span>
          <h2>Specialization Technical</h2>
        </div>
        <div class="grid-cards">

          <!-- Storage -->
          <button class="exam-card card-gold" onclick="selectExam('vcap-storage.json', 'Storage Specialization')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">Storage</span>
            <div class="card-footer">
              <span class="status-pill gold-pill">VCF 9.0 (3V0-23.25)</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

          <!-- Networking -->
          <button class="exam-card card-gold" onclick="selectExam('vcap-networking.json', 'Networking Specialization')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">Networking</span>
            <div class="card-footer">
              <span class="status-pill gold-pill">VCF 9.0 (3V0-25.25)</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

          <!-- Operations -->
          <button class="exam-card card-gold" onclick="selectExam('vcap-operations.json', 'Operations Specialization')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">Operations</span>
            <div class="card-footer">
              <span class="status-pill gold-pill">VCF 9.0 (3V0-22.25)</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

          <!-- Automation -->
          <button class="exam-card card-gold" onclick="selectExam('vcap-automation.json', 'Automation Specialization')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">Automation</span>
            <div class="card-footer">
              <span class="status-pill gold-pill">VCF 9.0 (3V0-21.25)</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

          <!-- VKS -->
          <button class="exam-card card-gold new-tag" onclick="selectExam('vcap-vks.json', 'VKS Specialization')">
            <span class="card-subtitle">Broadcom Partner Certification - Proven Professional</span>
            <span class="card-title">VKS</span>
            <div class="card-footer">
              <span class="status-pill gold-pill">VCF 9.0 (3V0-24.25)</span>
              <span class="arrow-icon">→</span>
            </div>
          </button>

        </div>
      </section>

    </main>

    <!-- PANTALLA DE PREGUNTAS (OCULTA INICIALMENTE) -->
    <div id="quiz-screen" style="display: none;">
      <div id="score-box" class="score-box"></div>
      <main id="questions-wrapper"></main>
      <div class="actions">
        <button id="submit-btn" class="btn-primary" onclick="evaluateExam()">Finalizar y Calificar</button>
        <button class="btn-secondary" onclick="goBackToMenu()">← Volver al Menú Principal</button>
      </div>
    </div>

  </div>

</body>
</html>
