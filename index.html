<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcom Partner Certification Simulator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Capa de fondo temático VMware / Broadcom -->
  <div class="vmware-bg"></div>

  <div class="app-container">
    <header class="main-header">
      <div class="brand">
        <span class="logo-text">BROADCOM PARTNER</span>
        <span class="badge-vcf">PROVEN PROFESSIONAL</span>
      </div>
      <h1 id="app-title">Simulador de Certificaciones</h1>
      <p id="question-counter" class="subtitle">Selecciona el examen de certificación oficial para comenzar</p>
    </header>

    <!-- PANTALLA PRINCIPAL: SELECTOR DE EXÁMENES -->
    <main id="exam-selector-screen">

      <!-- SECCIÓN: BROADCOM PARTNER CERTIFICATIONS -->
      <section class="exam-group">
        <h2>Broadcom Partner Certification - Proven Professional</h2>
        <div class="grid-cards">

          <!-- 1. Implementation -->
          <button class="exam-card blue" onclick="selectExam('vcf-implementation.json', 'Proven Professional - VCF Implementation')">
            <span class="card-tag">Implementation</span>
            <span class="card-title">VMware Cloud Foundation - Implementation</span>
            <span class="card-code">Broadcom Partner Certification</span>
          </button>

          <!-- 2. Architecture -->
          <button class="exam-card blue" onclick="selectExam('vcf-architecture.json', 'Proven Professional - VCF Architecture')">
            <span class="card-tag">Architecture</span>
            <span class="card-title">VMware Cloud Foundation - Architecture</span>
            <span class="card-code">Broadcom Partner Certification</span>
          </button>

          <!-- 3. Automation -->
          <button class="exam-card gold" onclick="selectExam('vcap-automation.json', 'Proven Professional - Automation')">
            <span class="card-title">Automation</span>
            <span class="card-code">VCF 9.0 Automation (3V0-21.25)</span>
          </button>

          <!-- 4. Operations -->
          <button class="exam-card gold" onclick="selectExam('vcap-operations.json', 'Proven Professional - Operations')">
            <span class="card-title">Operations</span>
            <span class="card-code">VCF 9.0 Operations (3V0-22.25)</span>
          </button>

          <!-- 5. Storage -->
          <button class="exam-card gold" onclick="selectExam('vcap-storage.json', 'Proven Professional - Storage')">
            <span class="card-title">Storage</span>
            <span class="card-code">VCF 9.0 Storage (3V0-23.25)</span>
          </button>

          <!-- 6. Networking -->
          <button class="exam-card gold" onclick="selectExam('vcap-networking.json', 'Proven Professional - Networking')">
            <span class="card-title">Networking</span>
            <span class="card-code">VCF 9.0 Networking (3V0-25.25)</span>
          </button>

          <!-- 7. VKS -->
          <button class="exam-card gold new-badge" onclick="selectExam('vcap-vks.json', 'Proven Professional - VKS')">
            <span class="card-title">VKS</span>
            <span class="card-code">VCF 9.0 VKS (3V0-24.25)</span>
          </button>

        </div>
      </section>

    </main>

    <!-- PANTALLA DE PREGUNTAS (OCULTA INICIALMENTE) -->
    <div id="quiz-screen" style="display: none;">
      <div id="score-box" class="score-box"></div>
      <main id="questions-wrapper"></main>
      <div class="actions">
        <button id="submit-btn" class="btn-primary" onclick="evaluateExam()">Finalizar y Calificar</button>
        <button class="btn-secondary" onclick="goBackToMenu()">← Volver al Menú Principal</button>
      </div>
    </div>

  </div>

</body>
</html>
